<!DOCTYPE html>
<html>
<head>
    <title>Book Vote Lab</title>
</head>
<body style="background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

    <center>
        <div style="background-color: white; width: 500px; margin-top: 50px; padding: 30px; border-radius: 10px; border: 1px solid #ddd; box-shadow: 0px 4px 8px rgba(0,0,0,0.1); text-align: left;">
            
            <h3 style="color: #333; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
                How is the book ASP.NET with c# by Vipul Prakashan?
            </h3>

            <form method="POST">
                {% csrf_token %}
                
                <table width="100%" cellpadding="10" cellspacing="0" border="0">
                    <tr>
                        <td width="40" valign="middle">
                            <input type="radio" name="choice" value="good" id="g" required style="transform: scale(1.2); cursor: pointer;">
                        </td>
                        <td valign="middle">
                            <label for="g" style="font-size: 16px; cursor: pointer;">Good</label>
                        </td>
                        <td align="right" valign="middle" style="color: #666; font-weight: bold;">
                            {{ good_pct|default:"0" }}%
                        </td>
                    </tr>

                    <tr>
                        <td valign="middle">
                            <input type="radio" name="choice" value="satisfactory" id="s" style="transform: scale(1.2); cursor: pointer;">
                        </td>
                        <td valign="middle">
                            <label for="s" style="font-size: 16px; cursor: pointer;">Satisfactory</label>
                        </td>
                        <td align="right" valign="middle" style="color: #666; font-weight: bold;">
                            {{ satisfactory_pct|default:"0" }}%
                        </td>
                    </tr>

                    <tr>
                        <td valign="middle">
                            <input type="radio" name="choice" value="bad" id="b" style="transform: scale(1.2); cursor: pointer;">
                        </td>
                        <td valign="middle">
                            <label for="b" style="font-size: 16px; cursor: pointer;">Bad</label>
                        </td>
                        <td align="right" valign="middle" style="color: #666; font-weight: bold;">
                            {{ bad_pct|default:"0" }}%
                        </td>
                    </tr>
                </table>

                <br>
                <div style="text-align: left;">
                    <input type="submit" value="Vote" style="background-color: #e0e0e0; border: 1px solid #adadad; padding: 6px 25px; cursor: pointer; border-radius: 3px; font-weight: 500;">
                </div>
            </form>
        </div>
    </center>

</body>
</html>
