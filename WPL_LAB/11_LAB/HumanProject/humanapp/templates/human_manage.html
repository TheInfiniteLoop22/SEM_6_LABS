<!DOCTYPE html>
<html>
<head>
    <title>Human Management</title>
</head>
<body>
    <h2>Human Database Management</h2>

    <form method="GET" action="">
        <label>Select First Name:</label>
        <select name="human_id" onchange="this.form.submit()">
            <option value="">-- Choose a Person --</option>
            {% for h in humans %}
                <option value="{{ h.id }}" {% if selected_human.id == h.id %}selected{% endif %}>
                    {{ h.first_name }}
                </option>
            {% endfor %}
        </select>
    </form>

    <hr>

    <form method="POST" action="">
        {% csrf_token %}
        <input type="hidden" name="curr_id" value="{{ selected_human.id|default:'' }}">
        
        <div style="margin-bottom: 10px;">
            {{ form.as_p }}
        </div>

        <button type="submit" name="update">Update Record</button>
        <button type="submit" name="delete" onclick="return confirm('Are you sure?')">Delete Record</button>
        <a href="{% url 'human_manage' %}">Clear Form</a>
    </form>

</body>
</html>
